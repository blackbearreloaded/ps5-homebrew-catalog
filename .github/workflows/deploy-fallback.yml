name: Deploy fallback (maintainer's own runner)

# For a GitHub Actions outage: the same deploy as the last job of ci.yml, on a
# runner the maintainer starts by hand for one job (docs/website.md, "Fallback
# deploy"). It is never started by a push, a schedule or a pull request: only
# by the repository owner, by hand, on main. With no such runner online, which
# is the normal state, a run started by mistake just waits in the queue.
#
# Keep its steps in line with the deploy job of ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy website to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, catalog-fallback]
    timeout-minutes: 20
    environment:
      name: cloudflare-pages
      url: https://homebrew.page/
    concurrency:
      group: deploy-cloudflare-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The runner's own Python is used (it needs Pillow and cryptography); nothing is installed.
      - run: python3 -m unittest discover -s tests
      - run: python3 -m catalog check
      - run: python3 -m catalog build --out dist --icon-cache .icon-cache
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only: raises the API rate limit for release facts
      - name: Sign the store API
        run: python3 -m catalog sign --out dist --require
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Upload to Cloudflare Pages
        run: |
          if npx --yes wrangler@4.143.0 pages deploy dist \
              --project-name "$PROJECT" --branch main \
              --commit-hash "$GITHUB_SHA" --commit-dirty=false \
              > "$RUNNER_TEMP/wrangler.log" 2>&1; then
            echo "Deployed to Cloudflare Pages."
          else
            echo "::error::Cloudflare Pages deployment failed. Redacted wrangler errors:"
            python3 -m catalog.redact "$RUNNER_TEMP/wrangler.log"
            exit 1
          fi
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
