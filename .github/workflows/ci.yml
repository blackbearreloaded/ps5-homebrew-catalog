name: CI

# A pull request runs the tests. Every merge to main publishes the site; a run started by hand
# (Actions > CI > Run workflow on main) publishes it again without a merge. Merges made close
# together each start a run, and they go out one after another.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests and offline check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Only the release scan's tests use these; without them those tests are skipped.
      - run: python3 -m pip install --disable-pip-version-check -r requirements-scan.txt
      - run: python3 -m unittest discover -s tests
      - run: python3 -m catalog check
      - name: Build the website (placeholder icons)
        run: python3 -m catalog build --no-icons --out "$RUNNER_TEMP/site"

  verify:
    name: Verify changed records
    # Before publishing: every record that changed since the commit that is online is verified
    # in full, which also covers commits that did not come through a pull request.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Find the commit that is online
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        # The store API's index names the commit it was built from. When it cannot be read, or
        # that commit is not in this history, BEFORE stays empty and every record is verified.
        run: |
          online=$(curl -fsS --retry 2 https://prosperostore.net/api/v1/index.json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin).get("commit", ""))' || true)
          if [[ $online =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$online" "$GITHUB_SHA" 2>/dev/null; then
            echo "BEFORE=$online" >> "$GITHUB_ENV"
          fi
      - run: python3 -m catalog push --before "$BEFORE" --after "$AFTER"
        env:
          AFTER: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}

  scan:
    name: Scan listed releases
    # Writes a small summary per listed release for the site's safety labels. It downloads and
    # reads files nobody has reviewed, so it has no secrets, and the deploy job reads its output
    # only as data. A release is scanned once: summaries are kept by the file's sha256.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-scan.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scan-cache
          key: scans-${{ hashFiles('apps/*.json', 'catalog/scan.py', 'catalog/scan_rules.yar') }}
          restore-keys: scans-
      - run: python3 -m catalog scan-all --cache .scan-cache --out scans
        env:
          GH_TOKEN: ${{ github.token }}   # read-only: `gh attestation verify` needs one
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scans
          path: scans
          retention-days: 7

  deploy:
    name: Build and sign the website
    # Only trusted code on main reaches this job, after a merge or in a run started by hand:
    # it never runs for pull requests. It is the job that holds the signing key (in the
    # environment still named cloudflare-pages). The website and its store API go to the
    # repository's GitHub Pages site, published by the next job.
    # The scan job may fail or be skipped: the site is then built without safety labels.
    needs: [tests, verify, scan]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.tests.result == 'success'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-pages
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    env:
      OWNER: ${{ github.repository_owner }}
      REPOSITORY: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      # Icon URLs are pinned, and release facts (size, date, content version) belong to one
      # exact file, so each is fetched once and reused by later deploys.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .icon-cache
          key: icons-${{ hashFiles('apps/*.json') }}
          restore-keys: icons-
      - name: Fetch the scan summaries
        if: needs.scan.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scans
          path: scans
      - name: Build the website
        run: >-
          python3 -m catalog build --out site-build --icon-cache .icon-cache --scans scans
          --site-url https://prosperostore.net --base /
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only: raises the API rate limit for release facts
      - name: Sign the store API
        # The only steps that see the signing key. They fail rather than publish a catalog
        # that consoles would refuse: unsigned, or signed with a key that isn't in keys/.
        run: python3 -m catalog sign --out site-build --base / --require
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-build


  pages:
    name: Publish the website to GitHub Pages
    # Publishes what the deploy job built and signed; it holds no secrets itself.
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
