name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests and offline check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Only the release scan's tests use these; without them those tests are skipped.
      - run: python3 -m pip install --disable-pip-version-check -r requirements-scan.txt
      - run: python3 -m unittest discover -s tests
      - run: python3 -m catalog check
      - name: Build the website (placeholder icons)
        run: python3 -m catalog build --no-icons --out "$RUNNER_TEMP/site"

  verify:
    name: Verify changed records
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m catalog push --before "$BEFORE" --after "$AFTER"
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}

  scan:
    name: Scan listed releases
    # Writes a small summary per listed release for the site's safety labels. It downloads and
    # reads files nobody has reviewed, so it has no secrets, and the deploy job reads its output
    # only as data. A release is scanned once: summaries are kept by the file's sha256.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-scan.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scan-cache
          key: scans-${{ hashFiles('apps/*.json', 'catalog/scan.py', 'catalog/scan_rules.yar') }}
          restore-keys: scans-
      - run: python3 -m catalog scan-all --cache .scan-cache --out scans
        env:
          GH_TOKEN: ${{ github.token }}   # read-only: `gh attestation verify` needs one
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scans
          path: scans
          retention-days: 7

  deploy:
    name: Deploy website to Cloudflare Pages
    # Only trusted code on main reaches this job: it never runs for pull requests.
    # deploy-fallback.yml repeats these steps for an Actions outage: change both together.
    # It is skipped until the CLOUDFLARE_PAGES_PROJECT repository variable exists.
    # The scan job may fail or be skipped: the site is then built without safety labels.
    needs: [tests, verify, scan]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.tests.result == 'success'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
      && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: https://homebrew.page/
    concurrency:
      group: deploy-cloudflare-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      # Icon URLs are pinned, and release facts (size, date, content version) belong to one
      # exact file, so each is fetched once and reused by later deploys.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .icon-cache
          key: icons-${{ hashFiles('apps/*.json') }}
          restore-keys: icons-
      - name: Fetch the scan summaries
        if: needs.scan.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scans
          path: scans
      - run: python3 -m catalog build --out dist --icon-cache .icon-cache --scans scans
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only: raises the API rate limit for release facts
      - name: Sign the store API
        # The only step that sees the signing key. It fails rather than publish a catalog
        # that consoles would refuse: unsigned, or signed with a key that isn't in keys/.
        run: python3 -m catalog sign --out dist --require
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Upload to Cloudflare Pages
        # This repository's Actions logs are public. Wrangler's output can
        # mention account details, so only a redacted error summary is printed.
        run: |
          # Create the Pages project on first use; this fails harmlessly when it exists.
          npx --yes wrangler@4.143.0 pages project create "$PROJECT" --production-branch main \
              > "$RUNNER_TEMP/wrangler-create.log" 2>&1 && echo "Created Pages project." || true
          if npx --yes wrangler@4.143.0 pages deploy dist \
              --project-name "$PROJECT" --branch main \
              --commit-hash "$GITHUB_SHA" --commit-dirty=false \
              > "$RUNNER_TEMP/wrangler.log" 2>&1; then
            echo "Deployed to Cloudflare Pages."
          else
            echo "::error::Cloudflare Pages deployment failed. Redacted wrangler errors:"
            python3 -m catalog.redact "$RUNNER_TEMP/wrangler.log"
            exit 1
          fi
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      # The mirror: the store API once more, built for this repository's GitHub Pages address, for
      # consoles on networks that can't reach the main site. Only the API is published there (JSON,
      # icons, signature); its `page` links name the website. Its files differ from the main
      # site's (icon addresses), so it has a manifest and a signature of its own, from the same key.
      - name: Build the API mirror
        run: >-
          python3 -m catalog build --out mirror --icon-cache .icon-cache --scans scans
          --site-url "https://${OWNER}.github.io" --base "/${REPOSITORY}/" --pages-url https://homebrew.page/
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
      - name: Sign the mirror's API
        run: python3 -m catalog sign --out mirror --base "/${REPOSITORY}/" --require
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          REPOSITORY: ${{ github.event.repository.name }}
      - name: Keep only the API for the mirror
        run: |
          mkdir pages
          cp -r "mirror/${REPOSITORY}/api" pages/api
          cp site/mirror/index.html pages/index.html
          touch pages/.nojekyll
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  mirror:
    name: Publish the API mirror to GitHub Pages
    # Publishes what the deploy job built and signed; it holds no secrets itself.
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
