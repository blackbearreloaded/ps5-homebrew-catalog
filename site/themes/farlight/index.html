<section class="stage" data-stage aria-label="Featured app">
  <div class="stage__art" aria-hidden="true"><img data-stage-field alt="" width="96" height="54"><img data-stage-field alt="" width="96" height="54"></div>
  <div class="stage__shade" aria-hidden="true"></div>
  <div class="stage__inner">
    <div class="stage__words" data-stage-words>
      <p class="kicker" data-stage-kicker></p>
      <h1 class="stage__title" data-stage-title></h1>
      <p class="stage__meta" data-stage-meta></p>
      <p class="stage__text" data-stage-text></p>
    </div>
    <div class="stage__actions">
      <a class="cta" data-stage-link href="$base"><span class="cta__glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>View details</a>
      <span class="mark" data-stage-mark hidden>Coming soon</span>
    </div>
    <div class="dots" data-stage-dots aria-hidden="true"></div>
    <div class="stage__cover" data-stage-cover aria-hidden="true"><img data-stage-icon alt="" width="512" height="512"><span class="stage__sheen"></span></div>
  </div>
</section>
<div class="shelves" data-shelves></div>
<section class="section" data-section-view aria-labelledby="section-title">
  <header class="section__head">
    <h1 class="section__title" id="section-title"><span data-section-title>PS5 homebrew</span><span class="count" data-section-count>$app_count</span></h1>
    <button type="button" class="sort" data-sort title="Change the order"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 5v14M7 19l-3.5-3.5M7 19l3.5-3.5M17 19V5M17 5l-3.5 3.5M17 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Sorted by <b data-sort-name>Name</b></button>
  </header>
  <div class="cats" data-cats role="group" aria-label="Categories" hidden></div>
  <ul class="tiles" data-tiles>
$cards
  </ul>
  <div class="empty" data-empty hidden><b>No matches</b><span>Try another app name or developer.</span></div>
</section>
