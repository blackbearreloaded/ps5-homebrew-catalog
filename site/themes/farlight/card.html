<li class="tile-item"$grid_attrs data-url="$url" data-icon="$icon" data-ambient="$ambient" data-accent="$accent" data-description="$description" data-title="$name" data-by="$author" data-kind-label="$kind_label" data-version="$version_label" data-size="$size_label">
  <a class="tile tone-$titleid" href="$url">
    <img class="tile__field" src="$ambient" alt="" width="96" height="54" loading="lazy" decoding="async">
    <span class="tile__shade" aria-hidden="true"></span>
    <span class="tile__icon"><img src="$icon" alt="" width="512" height="512" loading="lazy" decoding="async"></span>
    <span class="tile__name">$name</span>
    <span class="tile__author">$author</span>
  </a>
</li>
